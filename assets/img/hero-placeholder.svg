<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Platzhalterbild: frisches Brot der Bäckerei Eichholz">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2e4cd"/>
      <stop offset="55%" stop-color="#e3c69a"/>
      <stop offset="100%" stop-color="#7a4a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffe8b8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffe8b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a22"/>
      <stop offset="100%" stop-color="#3a2414"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d99a4e"/>
      <stop offset="100%" stop-color="#a06b26"/>
    </linearGradient>
    <linearGradient id="crustLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9bd7c"/>
      <stop offset="100%" stop-color="#c6893a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- wheat left -->
  <g stroke="#a06b26" stroke-width="4" fill="none" opacity="0.55">
    <path d="M120 780 C 100 620, 160 480, 140 340"/>
    <path d="M140 340 l-26 -22 M140 340 l30 -14 M170 400 l-28 -18 M170 400 l32 -8 M150 470 l-26 -20 M150 470 l30 -10"/>
  </g>
  <g stroke="#c6893a" stroke-width="4" fill="none" opacity="0.45">
    <path d="M1480 800 C 1500 640, 1440 500, 1460 360"/>
    <path d="M1460 360 l-26 -20 M1460 360 l30 -14 M1490 420 l-28 -16 M1490 420 l32 -10 M1470 490 l-26 -20 M1470 490 l30 -10"/>
  </g>

  <!-- wooden board -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#wood)"/>
  <g stroke="#2c1a0f" stroke-width="2" opacity="0.35">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="820" x2="1600" y2="820"/>
  </g>

  <!-- steam -->
  <g stroke="#fffaf0" stroke-width="6" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M660 430 C 640 390, 690 360, 670 320 C 650 280, 700 250, 685 210"/>
    <path d="M940 430 C 960 390, 910 360, 930 320 C 950 280, 900 250, 915 210"/>
  </g>

  <!-- back loaf -->
  <ellipse cx="800" cy="560" rx="230" ry="90" fill="url(#wood)" opacity="0.25"/>

  <!-- left loaf -->
  <g>
    <ellipse cx="560" cy="640" rx="190" ry="95" fill="url(#crust)"/>
    <ellipse cx="560" cy="618" rx="190" ry="82" fill="url(#crustLight)"/>
    <g stroke="#7a4a1e" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M430 600 Q 560 560 690 600"/>
      <path d="M450 630 Q 560 596 670 630"/>
    </g>
  </g>

  <!-- center loaf (largest) -->
  <g>
    <ellipse cx="820" cy="620" rx="260" ry="120" fill="url(#crust)"/>
    <ellipse cx="820" cy="590" rx="260" ry="104" fill="url(#crustLight)"/>
    <g stroke="#7a4a1e" stroke-width="7" stroke-linecap="round" opacity="0.6">
      <path d="M640 570 Q 820 520 1000 570"/>
      <path d="M660 610 Q 820 562 980 610"/>
      <path d="M680 648 Q 820 604 960 648"/>
    </g>
  </g>

  <!-- right loaf (bun stack) -->
  <g>
    <ellipse cx="1090" cy="650" rx="150" ry="78" fill="url(#crust)"/>
    <ellipse cx="1090" cy="632" rx="150" ry="66" fill="url(#crustLight)"/>
    <circle cx="1040" cy="608" r="14" fill="#f2e4cd" opacity="0.5"/>
    <circle cx="1090" cy="600" r="10" fill="#f2e4cd" opacity="0.4"/>
    <circle cx="1130" cy="614" r="12" fill="#f2e4cd" opacity="0.45"/>
  </g>

  <!-- small scattered grains -->
  <g fill="#f2e4cd" opacity="0.5">
    <ellipse cx="740" cy="700" rx="5" ry="3"/>
    <ellipse cx="900" cy="710" rx="5" ry="3"/>
    <ellipse cx="1000" cy="695" rx="5" ry="3"/>
    <ellipse cx="500" cy="700" rx="5" ry="3"/>
  </g>
</svg>
